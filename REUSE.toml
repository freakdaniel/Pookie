version = 1

[[annotations]]
path = [
  ".editorconfig", ".gitattributes", ".gitignore", ".github/**",
  "*.md", "*.json", "*.props", "*.targets", "*.slnx", "scripts/**", "tools/**",
  "src/**/*.cs", "src/**/*.csproj", "src/**/*.props", "src/**/*.js", "src/**/*.md", "src/**/*.json", "tests/**",
  "src/Pookie.App/Assets/logo.svg",
]
precedence = "closest"
SPDX-FileCopyrightText = ["2023 Richard Habitzreuter", "2026 Daniel Freak"]
SPDX-License-Identifier = "BSD-3-Clause"
SPDX-FileComment = "Pookie is distributed under BSD-3-Clause; the original MIT attribution and permission notice are retained in licenses/MIT.txt."

