version = 1

[[annotations]]
path = [
  ".editorconfig", ".gitattributes", ".gitignore", ".github/**",
  "*.md", "*.json", "*.props", "*.targets", "*.slnx", "scripts/**",
  "src/**/*.cs", "src/**/*.csproj", "src/**/*.js", "tests/**",
  "src/Pookie.App/Assets/logo.svg",
]
precedence = "closest"
SPDX-FileCopyrightText = ["2023 Richard Habitzreuter", "2026 Daniel Freak"]
SPDX-License-Identifier = "BSD-3-Clause"
