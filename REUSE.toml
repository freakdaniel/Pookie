[[annotations]]
path = ["src/Pookie.Recommendations/Models/musicnn-msd.onnx", "src/Pookie.Recommendations/Models/musicnn-moods.onnx"]
precedence = "closest"
SPDX-FileCopyrightText = ["Music Technology Group, Universitat Pompeu Fabra", "2026 Daniel Freak"]
SPDX-License-Identifier = "CC-BY-NC-SA-4.0"
SPDX-FileComment = """
MSD MusiCNN, MTG mood classifiers and DEAM arousal/valence regression converted
by Pookie to ONNX without retraining weights. The embedding head retains 200 outputs.
Original MSD model: https://essentia.upf.edu/models/feature-extractors/musicnn/msd-musicnn-1.pb
Mood heads: relaxed, party, sad and aggressive; author Pablo Alonso, Music Technology
Group, Universitat Pompeu Fabra. Sources: https://essentia.upf.edu/models/classification-heads/
DEAM: https://essentia.upf.edu/models/classification-heads/deam/deam-msd-musicnn-2.pb
Original model licensing: https://essentia.upf.edu/models/LICENSE
Full license and disclaimer: licenses/CC-BY-NC-SA-4.0.txt.
Conversion and numerical verification: tools/audio-embeddings/prepare_musicnn.py
and prepare_moods.py. Source hashes, class indices and conversion errors:
src/Pookie.Recommendations/Models/musicnn-msd.json and musicnn-moods.json.
Reference: Pons, J. and Serra, X. (2019), musicnn: Pre-trained convolutional neural
networks for music audio tagging. https://arxiv.org/abs/1909.06654
"""

[[annotations]]
path = "src/Pookie.App/Assets/Icons/*.svg"
precedence = "closest"
SPDX-FileCopyrightText = "2023 Phosphor Icons"
SPDX-License-Identifier = "MIT"
SPDX-FileComment = """
Embedded SVGs from https://github.com/phosphor-icons/core at commit
2b75f3ad12b420c9504ef05df8d2564a28f8500e; no runtime CDN dependency.
Most icons are upstream duotone assets, including squares-four, list-bullets, copy,
chat-circle, arrow-left, arrows-out, text-align-left and paper-plane-tilt.
Heart and playback variants include upstream fill assets; user uses assets/fill/user-fill.svg.
clock-counter-clockwise, thumbs-down and paperclip use assets/regular/ variants;
the filled dislike variant is assets/fill/thumbs-down-fill.svg.
Chat attachments use assets/fill/file-fill.svg and assets/regular/image.svg.
Full terms and attribution: licenses/MIT.txt.
"""

