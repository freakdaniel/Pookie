SPDX-FileComment = """
C# translation of public Chromium Host/CDM v10 layouts and unmanaged function
pointers from Kodi InputStream Adaptive commit e14d199a5ed7224d1c42a36619ab0a67d3d8f3f6:
https://github.com/xbmc/inputstream.adaptive/blob/e14d199a5ed7224d1c42a36619ab0a67d3d8f3f6/lib/cdm/cdm/media/cdm/api/content_decryption_module.h
