name: Build and package

on:
  push:
  pull_request:
  workflow_call:
    inputs:
      release_version:
        type: string
        required: true

jobs:
  reuse:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@v7
      - name: Check license metadata
        run: npm run license:check

  libvlc:
    needs: reuse
    permissions:
      contents: read
    uses: ./.github/workflows/libvlc-linux.yml

  ui-fixtures:
    needs: [reuse, libvlc]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      POOKIE_LIBVLC_ARCHIVE: ${{ github.workspace }}/artifacts/libvlc-runtime/libvlc-linux-x64.tar.gz
      POOKIE_LIBVLC_SHA256: ${{ needs.libvlc.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: libvlc-linux-x64
          path: artifacts/libvlc-runtime
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated UI runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y mutter xwayland dbus-x11 libgtk-3-0t64 libwebkit2gtk-4.1-0 libsecret-1-0 libgl1-mesa-dri
      - name: Publish the production-source fixture host
        run: dotnet publish tests/Pookie.App.SmokeTests -c Release -r linux-x64 --self-contained true -o artifacts/ui-probe
      - name: Verify account-free UI, queues and resource ownership
        run: node scripts/run-ui-smoke.cjs artifacts/ui-probe/Pookie.App.SmokeTests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-fixture-logs-linux-x64
          path: artifacts/ui-smoke
          if-no-files-found: warn

  build:
    needs: [reuse, libvlc]
    env:
      POOKIE_LIBVLC_ARCHIVE: ${{ github.workspace }}/artifacts/libvlc-runtime/libvlc-linux-x64.tar.gz
      POOKIE_LIBVLC_SHA256: ${{ needs.libvlc.outputs.sha256 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
          - os: macos-15-intel
            rid: osx-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: libvlc-linux-x64
          path: artifacts/libvlc-runtime
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build pinned MewUI packages
        shell: pwsh
        run: ./tools/mewui-source/build.ps1
      - name: Restore
        run: dotnet restore Pookie.slnx
      - name: Test
        if: runner.os != 'Windows'
        run: npm test
      - name: Enable Media Foundation for audio tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:WINDIR/System32/mfplat.dll")) {
            Install-WindowsFeature Server-Media-Foundation
          }
      - name: Test Windows including native PCM gain
        if: runner.os == 'Windows'
        run: npm test
      - name: Check JavaScript
        run: npm run lint
      - name: Verify native session storage across processes
        if: runner.os == 'Windows' || runner.os == 'macOS'
        run: dotnet run --project tests/Pookie.App.SmokeTests -c Release -- --session-vault-smoke-test
      - name: Verify development video runtime
        if: matrix.rid == 'linux-x64' || startsWith(matrix.rid, 'osx-')
        run: env -u LD_LIBRARY_PATH -u DYLD_LIBRARY_PATH -u DYLD_FALLBACK_LIBRARY_PATH -u VLC_PLUGIN_PATH dotnet run --project tests/Pookie.App.SmokeTests -c Release -- --chat-video-smoke-test
      - name: Publish Pookie
        run: dotnet publish src/Pookie.App -c Release -r ${{ matrix.rid }} --self-contained true -o artifacts/${{ matrix.rid }}
      - name: Verify bundled video runtime
        if: matrix.rid == 'linux-x64' || startsWith(matrix.rid, 'osx-')
        run: |
          dotnet publish tests/Pookie.App.SmokeTests -c Release -r ${{ matrix.rid }} --self-contained true -o artifacts/video-smoke
          mv artifacts/video-smoke "artifacts/video smoke relocated"
          env -u LD_LIBRARY_PATH -u DYLD_LIBRARY_PATH -u DYLD_FALLBACK_LIBRARY_PATH -u VLC_PLUGIN_PATH "artifacts/video smoke relocated/Pookie.App.SmokeTests" --chat-video-smoke-test
      - name: Prepare release packaging tools
        if: inputs.release_version != '' && runner.os != 'macOS'
        shell: bash
        run: |
          bash scripts/fetch-packaging-tools.sh "$RUNNER_TEMP/pookie-tools" "$RUNNER_OS"
          echo "$RUNNER_TEMP/pookie-tools" >> "$GITHUB_PATH"
      - name: Package Linux distributions
        if: inputs.release_version != '' && runner.os == 'Linux'
        env:
          VERSION: ${{ inputs.release_version }}
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak desktop-file-utils rpm
          scripts/package-linux.sh "$VERSION" artifacts/linux-x64 release
          dpkg-deb --info "release/Pookie-$VERSION-linux-x64.deb"
          rpm -qip "release/Pookie-$VERSION-linux-x64.rpm"
      - name: Build Windows installer and portable ZIP
        if: inputs.release_version != '' && runner.os == 'Windows'
        env:
          VERSION: ${{ inputs.release_version }}
        run: node scripts/package-windows.cjs $env:VERSION artifacts/win-x64 release
      - name: Verify Windows installation and removal
        if: inputs.release_version != '' && runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ inputs.release_version }}
        run: |
          $msi = (Resolve-Path "release/Pookie-$env:VERSION-win-x64.msi").Path
          $install = Join-Path $env:RUNNER_TEMP "Pookie install test"
          $process = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /norestart INSTALLFOLDER=`"$install`"" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Install failed with code $($process.ExitCode)" }
          try {
            foreach ($file in @("Pookie.exe", "Pookie.dll", "licenses/THIRD-PARTY-NOTICES.txt")) {
              if (!(Test-Path (Join-Path $install $file))) { throw "Missing installed file: $file" }
            }
            if (Test-Path (Join-Path $install "pookie.portable")) { throw "Portable marker in installed app" }
          } finally {
            $process = Start-Process msiexec.exe -ArgumentList "/x `"$msi`" /qn /norestart" -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Uninstall failed with code $($process.ExitCode)" }
          }
          if (Test-Path (Join-Path $install "Pookie.exe")) { throw "Uninstall left the executable behind" }
      - name: Package and verify macOS release
        if: inputs.release_version != '' && runner.os == 'macOS'
        env:
          VERSION: ${{ inputs.release_version }}
          RID: ${{ matrix.rid }}
        run: |
          mkdir -p release
          node scripts/package-macos.cjs "$VERSION" "$RID" "artifacts/$RID" release
          tar -czf "release/Pookie-$VERSION-$RID.tar.gz" -C artifacts "$RID"
      - uses: actions/upload-artifact@v4
        if: inputs.release_version != ''
        with:
          name: release-${{ matrix.rid }}
          path: release/
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: inputs.release_version == ''
        with:
          name: pookie-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}/
          if-no-files-found: error
