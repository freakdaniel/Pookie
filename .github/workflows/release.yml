name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pookie-release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      number: ${{ steps.version.outputs.number }}
    steps:
      - uses: actions/checkout@v4
      - name: Read and check the project version
        id: version
        shell: python
        run: |
          import json
          import os
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          version = ET.parse("Directory.Build.props").findtext("./PropertyGroup/VersionPrefix")
          if not re.fullmatch(r"(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*)){2}", version or ""):
              raise SystemExit("Set VersionPrefix to a numeric major.minor.patch version.")
          package = json.loads(Path("package.json").read_text())
          lock = json.loads(Path("package-lock.json").read_text())
          appstream = ET.parse("packaging/flatpak/io.github.freakdaniel.Pookie.metainfo.xml")
          versions = [package["version"], lock["version"], lock["packages"][""]["version"],
                      appstream.find("./releases/release").get("version")]
          if any(value != version for value in versions):
              raise SystemExit(f"Update npm and Flatpak release metadata to match {version}.")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"number={version}", file=output)

  build:
    needs: version
    uses: ./.github/workflows/main.yml
    with:
      release_version: ${{ needs.version.outputs.number }}

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Verify release packages and generate checksums
        working-directory: release
        run: |
          assets=("Pookie-$VERSION-win-x64.msi" "Pookie-$VERSION-win-x64-portable.zip")
          for extension in deb rpm AppImage flatpak; do
            assets+=("Pookie-$VERSION-linux-x64.$extension")
          done
          for rid in osx-arm64 osx-x64; do
            assets+=("Pookie-$VERSION-$rid.dmg" "Pookie-$VERSION-$rid.tar.gz")
          done
          for asset in "${assets[@]}"; do test -s "$asset"; done
          sha256sum "${assets[@]}" > SHA256SUMS
      - name: Publish the tested commit
        working-directory: release
        run: |
          tag="v$VERSION"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            if [[ "$(git rev-parse "refs/tags/$tag^{commit}")" != "$GITHUB_SHA" ]]; then
              echo "::error::Tag $tag already points to a different commit."
              exit 1
            fi
          fi

          # A retry can finish a draft from the same commit after an interrupted upload.
          existing=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq ".[] | select(.tag_name == \"$tag\") | [.draft, .target_commitish] | @tsv")
          if [[ -n "$existing" && "$existing" != $'true\t'"$GITHUB_SHA" ]]; then
            echo "::error::Version $VERSION already has a published release or a draft from another commit."
            exit 1
          fi
          if ! git show-ref --verify --quiet "refs/tags/$tag"; then
            git push origin "$GITHUB_SHA:refs/tags/$tag"
          fi
          if [[ -z "$existing" ]]; then
            gh release create "$tag" --verify-tag --target "$GITHUB_SHA" \
              --draft --title "Pookie $VERSION" --generate-notes
          fi
          gh release upload "$tag" Pookie-* SHA256SUMS --clobber
          gh release edit "$tag" --draft=false
