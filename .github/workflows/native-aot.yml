name: Native AOT

on: [push, pull_request]

jobs:
  libvlc:
    permissions:
      contents: read
    uses: ./.github/workflows/libvlc-linux.yml

  native:
    needs: libvlc
    env:
      POOKIE_LIBVLC_ARCHIVE: ${{ github.workspace }}/artifacts/libvlc-runtime/libvlc-linux-x64.tar.gz
      POOKIE_LIBVLC_SHA256: ${{ needs.libvlc.outputs.sha256 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
          - os: macos-15-intel
            rid: osx-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: libvlc-linux-x64
          path: artifacts/libvlc-runtime
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Install Linux build and browser prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev libgtk-3-0 libwebkit2gtk-4.1-0 libgl1-mesa-dri libglx-mesa0 xvfb dbus-x11
      - name: Restore pinned MewUI packages
        # The source revision and bootstrap implementation determine the feed.
        # Cache only our small local packages, not the system or toolchain.
        id: mewui-cache
        uses: actions/cache/restore@v4
        with:
          path: artifacts/mewui-source/packages
          key: mewui-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/mewui-source/*') }}
      - name: Prepare pinned MewUI packages
        shell: pwsh
        run: ./tools/mewui-source/build.ps1
      - name: Cache prepared MewUI packages
        if: steps.mewui-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: artifacts/mewui-source/packages
          key: ${{ steps.mewui-cache.outputs.cache-primary-key }}
      - name: Enable Media Foundation for Windows native checks
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:WINDIR/System32/mfplat.dll")) {
            Install-WindowsFeature Server-Media-Foundation
          }
      - name: Publish actual native executable
        id: publish
        shell: pwsh
        run: |
          dotnet publish src/Pookie.App -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishAot=true -p:TrimmerSingleWarn=false -p:TreatWarningsAsErrors=true -p:ILLinkTreatWarningsAsErrors=true -o artifacts/native-aot/${{ matrix.rid }} 2>&1 | Tee-Object artifacts/native-aot-${{ matrix.rid }}.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify early exit cannot pass the native runner
        shell: pwsh
        run: |
          function Invoke-EarlyExit {
            $global:LASTEXITCODE = 0
            'AOT_BROWSER_OK: simulated exit before the final UI assertion'
          }
          try {
            ./scripts/verify-native-aot.ps1 -Executable Invoke-EarlyExit -Check ui -LogFile artifacts/early-exit-probe.log
            throw 'The native runner accepted an incomplete UI check.'
          } catch {
            if ($_.Exception.Message -notlike '*missing AOT_UI_OK:*') { throw }
          }
      - name: Verify native dependencies on Linux
        if: runner.os == 'Linux'
        run: dbus-run-session -- pwsh -File scripts/verify-native-aot.ps1 -Executable ./artifacts/native-aot/${{ matrix.rid }}/Pookie -Check dependencies -VideoFixture tests/Fixtures/Media/chat-video.mp4 -LogFile artifacts/native-aot-${{ matrix.rid }}-dependencies.log
      - name: Verify native dependencies on macOS
        if: runner.os == 'macOS'
        shell: pwsh
        run: ./scripts/verify-native-aot.ps1 -Executable ./artifacts/native-aot/${{ matrix.rid }}/Pookie -Check dependencies -VideoFixture tests/Fixtures/Media/chat-video.mp4 -LogFile artifacts/native-aot-${{ matrix.rid }}-dependencies.log
      - name: Verify native dependencies on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify-native-aot.ps1 -Executable ./artifacts/native-aot/${{ matrix.rid }}/Pookie.exe -Check dependencies -VideoFixture tests/Fixtures/Media/chat-video.mp4 -LogFile artifacts/native-aot-${{ matrix.rid }}-dependencies.log
      - name: Verify native UI and embedded WebKit on Linux
        if: ${{ !cancelled() && steps.publish.outcome == 'success' && runner.os == 'Linux' }}
        run: xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 pwsh -File scripts/verify-native-aot.ps1 -Executable ./artifacts/native-aot/${{ matrix.rid }}/Pookie -Check ui -LogFile artifacts/native-aot-${{ matrix.rid }}-ui.log
      - name: Verify native UI and WebView2 WinRT on Windows
        if: ${{ !cancelled() && steps.publish.outcome == 'success' && runner.os == 'Windows' }}
        shell: pwsh
        run: ./scripts/verify-native-aot.ps1 -Executable ./artifacts/native-aot/${{ matrix.rid }}/Pookie.exe -Check ui -LogFile artifacts/native-aot-${{ matrix.rid }}-ui.log
      - name: Verify native UI and WKWebView on macOS
        if: ${{ !cancelled() && steps.publish.outcome == 'success' && runner.os == 'macOS' }}
        shell: pwsh
        run: ./scripts/verify-native-aot.ps1 -Executable ./artifacts/native-aot/${{ matrix.rid }}/Pookie -Check ui -LogFile artifacts/native-aot-${{ matrix.rid }}-ui.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-aot-${{ matrix.rid }}
          path: |
            artifacts/native-aot/${{ matrix.rid }}/
            artifacts/native-aot-${{ matrix.rid }}*.log
          if-no-files-found: error
